  WITHDRAWAL_RESOLVED_EVENT_STATE_UNSPECIFIED = 0;
  WITHDRAWAL_RESOLVED_EVENT_STATE_COMPLETED = 1;
  WITHDRAWAL_RESOLVED_EVENT_STATE_REJECTED = 2;
}

message EventEnvelope {
  optional string message_id = 1;
  optional EventEnvelopeSource source = 2;
  optional EventType event_type = 3;
  optional int32 schema_version = 4;
  optional string operator_id = 5;
  optional string correlation_id = 6;
  optional string occurred_at = 7;
  EventPayload payload = 8;
}

message EventPayload {
  oneof payload {
    PlayerRegisteredEvent player_registered_event = 1;
    PlayerProfileChangedEvent player_profile_changed_event = 2;
    PlayerEligibilityChangedEvent player_eligibility_changed_event = 3;
    MatchPhaseChangedEvent match_phase_changed_event = 4;
    EventResult event_result = 5;
    BetStateChangedEvent bet_state_changed_event = 6;
    LedgerPostedEvent ledger_posted_event = 7;
    WithdrawalResolvedEvent withdrawal_resolved_event = 8;
    WalletCreatedEvent wallet_created_event = 9;
  }
}

message PlayerRegisteredEvent {
  optional string player_id = 1;
  optional string registered_at = 2;
}

message PlayerProfileChangedEvent {
  optional string player_id = 1;
  optional int64 version = 2;
  repeated ProfileField changed_fields = 3;
}

message PlayerEligibilityChangedEvent {
  optional string player_id = 1;
  optional PlayerCapability capability = 2;
  optional int64 player_version = 3;
  optional string policy_version = 4;
  optional string evaluated_at = 5;
}

message MatchPhaseChangedEvent {
  optional string event_id = 1;
  optional string run_id = 2;
  optional EventPhase phase = 3;
  optional int64 phase_seq = 4;
  optional string simulated_at = 5;
}

message EventResult {
  optional string result_id = 1;
  optional string event_id = 2;
  optional string run_id = 3;
  optional int64 result_seq = 4;
  optional int32 home_goals = 5;
  optional int32 away_goals = 6;
  optional EventResultOutcome outcome = 7;
  optional string occurred_at = 8;
}

message BetStateChangedEvent {
  optional string bet_id = 1;
  optional string player_id = 2;
  optional BetStatus status = 3;
  optional int64 version = 4;
  optional BetStateChangedEventFinancialState financial_state = 5;
}

message LedgerPostedEvent {
  optional string transaction_id = 1;
  optional string request_id = 2;
  optional string business_ref = 3;
  optional TransactionType transaction_type = 4;
  optional string currency = 5;
  optional int64 amount_minor = 6;
}

message WithdrawalResolvedEvent {
  optional string withdrawal_id = 1;
  optional string wallet_id = 2;
  optional WithdrawalResolvedEventState state = 3;
  optional string resolution_transaction_id = 4;
}

message WalletCreatedEvent {
  optional string wallet_id = 1;
  optional string player_id = 2;
  optional string currency = 3;
}

message RegisterPlayerRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string external_ref = 3;
  optional string locale = 4;
  optional string time_zone = 5;
}

message CallContext {
  optional string operator_id = 1;
  optional string actor_id = 2;
  optional CallContextActorKind actor_kind = 3;
  optional string player_id = 4;
  repeated Capability capabilities = 5;
  optional string correlation_id = 6;
  optional string deadline_at = 7;
}

message PlayerRegisterPlayerOutput {
  Profile profile = 1;
  optional bool created = 2;
}

message Profile {
  optional string player_id = 1;
  optional ProfileStatus status = 2;
  optional string first_name = 3;
  optional string last_name = 4;
  optional string birth_date = 5;
  optional string residence_country = 6;
  optional string nationality_country = 7;
  optional string locale = 8;
  optional string time_zone = 9;
  optional int64 version = 10;
  optional string created_at = 11;
  optional string updated_at = 12;
}

message Error {
  optional ErrorCode code = 1;
  optional string message = 2;
  optional string correlation_id = 3;
  repeated ErrorFields fields = 4;
  optional bool retryable = 5;
  optional bool outcome_unknown = 6;
  optional int32 retry_after_ms = 7;
}

message ErrorFields {
  optional string path = 1;
  optional string code = 2;
}

message GetPlayerRequest {
  CallContext context = 1;
  optional string player_id = 2;
}

message PlayerGetPlayerOutput {
  Profile profile = 1;
  repeated Contact contacts = 2;
}

message Contact {
  optional string contact_id = 1;
  optional ContactKind kind = 2;
  optional string display_value = 3;
  optional bool is_primary = 4;
  optional string verified_at = 5;
}

message UpdatePlayerProfileRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional int64 expected_version = 4;
  UpdatePlayerProfileRequestPatch patch = 5;
}

message UpdatePlayerProfileRequestPatch {
  optional string first_name = 1;
  optional string last_name = 2;
  optional string birth_date = 3;
  optional string residence_country = 4;
  optional string nationality_country = 5;
  optional string locale = 6;
  optional string time_zone = 7;
}

message PlayerUpdatePlayerProfileOutput {
  Profile profile = 1;
}

message AddContactRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional AddContactRequestKind kind = 4;
  optional string value = 5;
  optional bool is_primary = 6;
}

message PlayerAddContactOutput {
  Contact contact = 1;
}

message VerifyContactRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional string contact_id = 4;
  optional string proof_ref = 5;
}

message PlayerVerifyContactOutput {
  Contact contact = 1;
}

message ChangePlayerStatusRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional int64 expected_version = 4;
  optional ChangePlayerStatusRequestStatus status = 5;
  optional string reason_code = 6;
}

message PlayerChangePlayerStatusOutput {
  Profile profile = 1;
}

message OpenKycCaseRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional OpenKycCaseRequestRequiredLevel required_level = 4;
}

message PlayerOpenKycCaseOutput {
  KycCase kyc_case = 1;
}

message KycCase {
  optional string case_id = 1;
  optional string player_id = 2;
  optional KycCaseRequiredLevel required_level = 3;
  optional KycCaseStatus status = 4;
  optional string policy_version = 5;
  optional string decision_code = 6;
  optional string valid_until = 7;
  optional int64 version = 8;
}

message RecordKycCheckRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional string case_id = 4;
  KycCheck check = 5;
}

message KycCheck {
  optional string check_id = 1;
  optional string case_id = 2;
  optional KycCheckCheckType check_type = 3;
  optional int32 attempt_no = 4;
  optional KycCheckProvider provider = 5;
  optional string provider_check_ref = 6;
  optional KycCheckStatus status = 7;
  optional string result_code = 8;
  optional string completed_at = 9;
}

message PlayerRecordKycCheckOutput {
  KycCheck check = 1;
  KycCase kyc_case = 2;
}

message DecideKycCaseRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional string case_id = 4;
  optional int64 expected_version = 5;
  optional DecideKycCaseRequestDecision decision = 6;
  optional string decision_code = 7;
  optional string valid_until = 8;
}

message PlayerDecideKycCaseOutput {
  KycCase kyc_case = 1;
}

message GetKycStatusRequest {
  CallContext context = 1;
  optional string player_id = 2;
}

message PlayerGetKycStatusOutput {
  repeated KycCase cases = 1;
  optional string evaluated_at = 2;
}

message ApplyRestrictionRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional ApplyRestrictionRequestType type = 4;
  optional string reason_code = 5;
  optional string starts_at = 6;
  optional string ends_at = 7;
}

message PlayerApplyRestrictionOutput {
  Restriction restriction = 1;
}

message Restriction {
  optional string restriction_id = 1;
  optional string player_id = 2;
  optional RestrictionType type = 3;
  optional RestrictionState state = 4;
  optional string reason_code = 5;
  optional string starts_at = 6;
  optional string ends_at = 7;
  optional string cleared_at = 8;
}

message ClearRestrictionRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional string restriction_id = 4;
  optional string reason_code = 5;
}

message PlayerClearRestrictionOutput {
  Restriction restriction = 1;
}

message GetRestrictionsRequest {
  CallContext context = 1;
  optional string player_id = 2;
  PageInput page = 3;
  optional GetRestrictionsRequestState state = 4;
}

message PageInput {
  optional int32 limit = 1;
  optional string cursor = 2;
  optional string from = 3;
  optional string to = 4;
}

message PlayerGetRestrictionsOutput {
  repeated Restriction restrictions = 1;
  optional string next_cursor = 2;
  optional string evaluated_at = 3;
}

message CheckEligibilityRequest {
  CallContext context = 1;
  optional string player_id = 2;
  optional CheckEligibilityRequestCapability capability = 3;
}

message PlayerCheckEligibilityOutput {
  Eligibility eligibility = 1;
}

message Eligibility {
  optional bool allowed = 1;
  optional EligibilityReasonCode reason_code = 2;
  optional string policy_version = 3;
  optional string evaluated_at = 4;
  optional string valid_until = 5;
  optional int64 player_version = 6;
}

message GetPlayerReferenceRequest {
  CallContext context = 1;
  optional string player_id = 2;
}

message PlayerGetPlayerReferenceOutput {
  optional string operator_id = 1;
  optional string player_id = 2;
  optional bool exists = 3;
}

message RegisterPlayerResponse {
  oneof outcome {
    PlayerRegisterPlayerOutput value = 1;
    Error error = 2;
  }
}

message GetPlayerResponse {
  oneof outcome {
    PlayerGetPlayerOutput value = 1;
    Error error = 2;
  }
}

message UpdatePlayerProfileResponse {
  oneof outcome {
    PlayerUpdatePlayerProfileOutput value = 1;
    Error error = 2;
  }
}

message AddContactResponse {
