}

message CancelBetRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string bet_id = 3;
  optional CancelBetRequestReasonCode reason_code = 4;
}

message ReconcileLedgerRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string run_id = 3;
  optional string cutoff = 4;
  PageInput page = 5;
}

message GetWalletRequest {
  CallContext context = 1;
  optional string player_id = 2;
  optional string currency = 3;
}

message CreateWalletResponse {
  oneof outcome {
    LedgerCreateWalletOutput value = 1;
    Error error = 2;
  }
