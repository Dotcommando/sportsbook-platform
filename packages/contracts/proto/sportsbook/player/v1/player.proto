syntax = "proto3";

package sportsbook.player.v1;

// Private service API. Validate required fields, scope and enum values at adapter boundaries.
// UUIDs are canonical strings; instants are offset-qualified UTC strings; dates remain dates.
// int64 money/version values decode as bigint and encode as decimal strings in JSON.
service PlayerService {
  rpc RegisterPlayer(RegisterPlayerRequest) returns (RegisterPlayerResponse);
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse);
  rpc UpdatePlayerProfile(UpdatePlayerProfileRequest) returns (UpdatePlayerProfileResponse);
  rpc AddContact(AddContactRequest) returns (AddContactResponse);
  rpc VerifyContact(VerifyContactRequest) returns (VerifyContactResponse);
  rpc ChangePlayerStatus(ChangePlayerStatusRequest) returns (ChangePlayerStatusResponse);
  rpc OpenKycCase(OpenKycCaseRequest) returns (OpenKycCaseResponse);
  rpc RecordKycCheck(RecordKycCheckRequest) returns (RecordKycCheckResponse);
  rpc DecideKycCase(DecideKycCaseRequest) returns (DecideKycCaseResponse);
  rpc GetKycStatus(GetKycStatusRequest) returns (GetKycStatusResponse);
  rpc ApplyRestriction(ApplyRestrictionRequest) returns (ApplyRestrictionResponse);
  rpc ClearRestriction(ClearRestrictionRequest) returns (ClearRestrictionResponse);
  rpc GetRestrictions(GetRestrictionsRequest) returns (GetRestrictionsResponse);
  rpc CheckEligibility(CheckEligibilityRequest) returns (CheckEligibilityResponse);
  rpc GetPlayerReference(GetPlayerReferenceRequest) returns (GetPlayerReferenceResponse);
}

