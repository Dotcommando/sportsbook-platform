  FINANCIAL_OUTCOME_STATE_COMPLETED = 1;
  FINANCIAL_OUTCOME_STATE_REJECTED = 2;
}

enum JournalViewStatus {
  JOURNAL_VIEW_STATUS_UNSPECIFIED = 0;
  JOURNAL_VIEW_STATUS_POSTED = 1;
  JOURNAL_VIEW_STATUS_REJECTED = 2;
}

enum LedgerGetCommandOutcomeOutputState {
  LEDGER_GET_COMMAND_OUTCOME_OUTPUT_STATE_UNSPECIFIED = 0;
  LEDGER_GET_COMMAND_OUTCOME_OUTPUT_STATE_IN_PROGRESS = 1;
  LEDGER_GET_COMMAND_OUTCOME_OUTPUT_STATE_COMPLETED = 2;
  LEDGER_GET_COMMAND_OUTCOME_OUTPUT_STATE_FAILED_FINAL = 3;
}

enum PlayerCapability {
