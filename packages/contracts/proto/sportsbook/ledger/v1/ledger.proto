}

enum WithdrawalViewState {
  WITHDRAWAL_VIEW_STATE_UNSPECIFIED = 0;
  WITHDRAWAL_VIEW_STATE_HELD = 1;
  WITHDRAWAL_VIEW_STATE_COMPLETED = 2;
  WITHDRAWAL_VIEW_STATE_REJECTED = 3;
}

message EventEnvelope {
  optional string message_id = 1;
  optional EventEnvelopeSource source = 2;
  optional EventType event_type = 3;
  optional int32 schema_version = 4;
  optional string operator_id = 5;
  optional string correlation_id = 6;
  optional string occurred_at = 7;
  EventPayload payload = 8;
}

message EventPayload {
  oneof payload {
    PlayerRegisteredEvent player_registered_event = 1;
    PlayerProfileChangedEvent player_profile_changed_event = 2;
    PlayerEligibilityChangedEvent player_eligibility_changed_event = 3;
    MatchPhaseChangedEvent match_phase_changed_event = 4;
    EventResult event_result = 5;
    BetStateChangedEvent bet_state_changed_event = 6;
    LedgerPostedEvent ledger_posted_event = 7;
    WithdrawalResolvedEvent withdrawal_resolved_event = 8;
    WalletCreatedEvent wallet_created_event = 9;
  }
}

message PlayerRegisteredEvent {
  optional string player_id = 1;
  optional string registered_at = 2;
}

message PlayerProfileChangedEvent {
  optional string player_id = 1;
  optional int64 version = 2;
  repeated ProfileField changed_fields = 3;
}

message PlayerEligibilityChangedEvent {
  optional string player_id = 1;
  optional PlayerCapability capability = 2;
  optional int64 player_version = 3;
  optional string policy_version = 4;
  optional string evaluated_at = 5;
}

message MatchPhaseChangedEvent {
  optional string event_id = 1;
  optional string run_id = 2;
  optional EventPhase phase = 3;
  optional int64 phase_seq = 4;
  optional string simulated_at = 5;
}

message EventResult {
  optional string result_id = 1;
  optional string event_id = 2;
  optional string run_id = 3;
  optional int64 result_seq = 4;
  optional int32 home_goals = 5;
  optional int32 away_goals = 6;
  optional EventResultOutcome outcome = 7;
  optional string occurred_at = 8;
}

message BetStateChangedEvent {
  optional string bet_id = 1;
  optional string player_id = 2;
  optional BetStatus status = 3;
  optional int64 version = 4;
  optional BetStateChangedEventFinancialState financial_state = 5;
}

message LedgerPostedEvent {
  optional string transaction_id = 1;
  optional string request_id = 2;
  optional string business_ref = 3;
  optional TransactionType transaction_type = 4;
  optional string currency = 5;
  optional int64 amount_minor = 6;
}

message WithdrawalResolvedEvent {
  optional string withdrawal_id = 1;
  optional string wallet_id = 2;
  optional WithdrawalResolvedEventState state = 3;
  optional string resolution_transaction_id = 4;
}

message WalletCreatedEvent {
  optional string wallet_id = 1;
  optional string player_id = 2;
  optional string currency = 3;
}

message CreateWalletRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string player_id = 3;
  optional string currency = 4;
}

message CallContext {
  optional string operator_id = 1;
  optional string actor_id = 2;
  optional CallContextActorKind actor_kind = 3;
  optional string player_id = 4;
  repeated Capability capabilities = 5;
  optional string correlation_id = 6;
  optional string deadline_at = 7;
}

message LedgerCreateWalletOutput {
  WalletView wallet = 1;
  optional bool created = 2;
}

message WalletView {
  optional string wallet_id = 1;
  optional string player_id = 2;
  optional string currency = 3;
  optional WalletViewStatus status = 4;
  optional int64 available_minor = 5;
  optional int64 reserved_minor = 6;
  optional int64 withdrawal_hold_minor = 7;
  optional int64 version = 8;
  optional string observed_at = 9;
}

message Error {
  optional ErrorCode code = 1;
  optional string message = 2;
  optional string correlation_id = 3;
  repeated ErrorFields fields = 4;
  optional bool retryable = 5;
  optional bool outcome_unknown = 6;
  optional int32 retry_after_ms = 7;
}

message ErrorFields {
  optional string path = 1;
  optional string code = 2;
}

message GetBalanceRequest {
  CallContext context = 1;
  optional string wallet_id = 2;
}

message LedgerGetBalanceOutput {
  WalletView wallet = 1;
}

message GetTransactionRequest {
  CallContext context = 1;
  optional string transaction_id = 2;
}

message LedgerGetTransactionOutput {
  JournalView transaction = 1;
}

message JournalView {
  optional string transaction_id = 1;
  optional string request_id = 2;
  optional TransactionType transaction_type = 3;
  optional string business_ref = 4;
  optional string currency = 5;
  optional JournalViewStatus status = 6;
  optional string posted_at = 7;
  repeated Entry entries = 8;
}

message Entry {
  optional string entry_id = 1;
  optional string account_id = 2;
  optional string transaction_id = 3;
  optional int32 entry_no = 4;
  optional EntrySide side = 5;
  optional int64 amount_minor = 6;
  optional string currency = 7;
  optional string posted_at = 8;
}

message GetLedgerEntriesRequest {
  CallContext context = 1;
  optional string wallet_id = 2;
  PageInput page = 3;
}

message PageInput {
  optional int32 limit = 1;
  optional string cursor = 2;
  optional string from = 3;
  optional string to = 4;
}

message LedgerGetLedgerEntriesOutput {
  repeated Entry entries = 1;
  optional string next_cursor = 2;
  optional string observed_at = 3;
}

message GetWalletTransactionsRequest {
  CallContext context = 1;
  optional string wallet_id = 2;
  PageInput page = 3;
}

message LedgerGetWalletTransactionsOutput {
  repeated JournalView transactions = 1;
  optional string next_cursor = 2;
  optional string observed_at = 3;
}

message GetBetFinancialStatusRequest {
  CallContext context = 1;
  optional string bet_id = 2;
}

message LedgerGetBetFinancialStatusOutput {
  ReservationView reservation = 1;
  optional string observed_at = 2;
}

message ReservationView {
  optional string bet_id = 1;
  optional string wallet_id = 2;
  Money stake = 3;
  optional ReservationViewState state = 4;
  optional string reservation_transaction_id = 5;
  optional string settlement_transaction_id = 6;
  optional int64 settlement_seq = 7;
  optional int64 gross_payout_minor = 8;
}

message Money {
  optional int64 amount_minor = 1;
  optional string currency = 2;
}

message GetWithdrawalRequest {
  CallContext context = 1;
  optional string withdrawal_id = 2;
}

message LedgerGetWithdrawalOutput {
  WithdrawalView withdrawal = 1;
}

message WithdrawalView {
  optional string withdrawal_id = 1;
  optional string wallet_id = 2;
  Money amount = 3;
  optional WithdrawalViewState state = 4;
  optional string hold_transaction_id = 5;
  optional string resolution_transaction_id = 6;
  optional string provider_ref = 7;
  optional string reason_code = 8;
  optional string created_at = 9;
  optional string resolved_at = 10;
}

message GetCommandOutcomeRequest {
  CallContext context = 1;
  optional string request_id = 2;
}

message LedgerGetCommandOutcomeOutput {
  optional bool found = 1;
  optional string operation = 2;
  optional LedgerGetCommandOutcomeOutputState state = 3;
  RegisteredOutputResult result = 4;
}

message RegisteredOutput {
  oneof operation_output {
    LedgerCreateWalletOutput create_wallet = 1;
    LedgerGetBalanceOutput get_balance = 2;
    LedgerGetTransactionOutput get_transaction = 3;
    LedgerGetLedgerEntriesOutput get_ledger_entries = 4;
    LedgerGetWalletTransactionsOutput get_wallet_transactions = 5;
    LedgerGetBetFinancialStatusOutput get_bet_financial_status = 6;
    LedgerGetWithdrawalOutput get_withdrawal = 7;
    LedgerDepositTestFundsOutput deposit_test_funds = 8;
    LedgerRequestWithdrawalOutput request_withdrawal = 9;
    LedgerCompleteWithdrawalOutput complete_withdrawal = 10;
    LedgerRejectWithdrawalOutput reject_withdrawal = 11;
    LedgerReserveStakeOutput reserve_stake = 12;
    LedgerSettleWinOutput settle_win = 13;
    LedgerSettleLossOutput settle_loss = 14;
    LedgerCancelBetOutput cancel_bet = 15;
    LedgerReconcileLedgerOutput reconcile_ledger = 16;
    LedgerGetWalletOutput get_wallet = 17;
  }
}

message LedgerDepositTestFundsOutput {
  FinancialOutcome outcome = 1;
}

message FinancialOutcome {
  optional string request_id = 1;
  optional FinancialOutcomeState state = 2;
  optional string transaction_id = 3;
  optional string business_ref = 4;
  WalletView wallet = 5;
  optional ErrorCode reason_code = 6;
  optional bool replayed = 7;
}

message LedgerRequestWithdrawalOutput {
  WithdrawalView withdrawal = 1;
  FinancialOutcome outcome = 2;
}

message LedgerCompleteWithdrawalOutput {
  WithdrawalView withdrawal = 1;
  FinancialOutcome outcome = 2;
}

message LedgerRejectWithdrawalOutput {
  WithdrawalView withdrawal = 1;
  FinancialOutcome outcome = 2;
}

message LedgerReserveStakeOutput {
  ReservationView reservation = 1;
  FinancialOutcome outcome = 2;
}

message LedgerSettleWinOutput {
  ReservationView reservation = 1;
  FinancialOutcome outcome = 2;
}

message LedgerSettleLossOutput {
  ReservationView reservation = 1;
  FinancialOutcome outcome = 2;
}

message LedgerCancelBetOutput {
  ReservationView reservation = 1;
  FinancialOutcome outcome = 2;
}

message LedgerReconcileLedgerOutput {
  ReconciliationReport report = 1;
}

message ReconciliationReport {
  optional string run_id = 1;
  optional string snapshot_at = 2;
  optional ReconciliationReportStatus status = 3;
  ReconciliationReportCounts counts = 4;
  repeated ReconciliationReportViolations violations = 5;
  optional string next_cursor = 6;
}

message ReconciliationReportCounts {
  optional int64 transactions = 1;
  optional int64 entries = 2;
  optional int64 violations = 3;
}

message ReconciliationReportViolations {
  optional string code = 1;
  optional string business_ref = 2;
}

message LedgerGetWalletOutput {
  WalletView wallet = 1;
}

message DepositTestFundsRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string wallet_id = 3;
  Money amount = 4;
  optional string provider_ref = 5;
}

message RequestWithdrawalRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string wallet_id = 3;
  optional string withdrawal_id = 4;
  Money amount = 5;
}

message CompleteWithdrawalRequest {
  CallContext context = 1;
  optional string request_id = 2;
  optional string withdrawal_id = 3;
  optional string provider_ref = 4;
}

message RejectWithdrawalRequest {
  CallContext context = 1;
  optional string request_id = 2;
