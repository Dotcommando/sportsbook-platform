name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Reproduce the pinned Rover supergraph artifact
        run: pnpm --filter @sportsbook/federation exec tsx src/cli.ts --check-rover
      - name: Contract compatibility against the base revision
        if: github.event_name == 'pull_request'
        run: pnpm contracts:breaking -- "${{ github.event.pull_request.base.sha }}"
      - run: pnpm test:postgres
      - name: Private Router and Gateway financial workflows
        run: pnpm --filter @sportsbook/federation test-integration
