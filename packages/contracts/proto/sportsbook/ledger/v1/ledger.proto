syntax = "proto3";

package sportsbook.ledger.v1;

// Private service API. Validate required fields, scope and enum values at adapter boundaries.
// UUIDs are canonical strings; instants are offset-qualified UTC strings; dates remain dates.
// int64 money/version values decode as bigint and encode as decimal strings in JSON.
service LedgerService {
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc GetLedgerEntries(GetLedgerEntriesRequest) returns (GetLedgerEntriesResponse);
  rpc GetWalletTransactions(GetWalletTransactionsRequest) returns (GetWalletTransactionsResponse);
  rpc GetBetFinancialStatus(GetBetFinancialStatusRequest) returns (GetBetFinancialStatusResponse);
  rpc GetWithdrawal(GetWithdrawalRequest) returns (GetWithdrawalResponse);
  rpc GetCommandOutcome(GetCommandOutcomeRequest) returns (GetCommandOutcomeResponse);
  rpc DepositTestFunds(DepositTestFundsRequest) returns (DepositTestFundsResponse);
  rpc RequestWithdrawal(RequestWithdrawalRequest) returns (RequestWithdrawalResponse);
  rpc CompleteWithdrawal(CompleteWithdrawalRequest) returns (CompleteWithdrawalResponse);
  rpc RejectWithdrawal(RejectWithdrawalRequest) returns (RejectWithdrawalResponse);
  rpc ReserveStake(ReserveStakeRequest) returns (ReserveStakeResponse);
  rpc SettleWin(SettleWinRequest) returns (SettleWinResponse);
  rpc SettleLoss(SettleLossRequest) returns (SettleLossResponse);
  rpc CancelBet(CancelBetRequest) returns (CancelBetResponse);
  rpc ReconcileLedger(ReconcileLedgerRequest) returns (ReconcileLedgerResponse);
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);
}

enum BetStateChangedEventFinancialState {
  BET_STATE_CHANGED_EVENT_FINANCIAL_STATE_UNSPECIFIED = 0;
  BET_STATE_CHANGED_EVENT_FINANCIAL_STATE_UNCONFIRMED = 1;
  BET_STATE_CHANGED_EVENT_FINANCIAL_STATE_RESERVED = 2;
  BET_STATE_CHANGED_EVENT_FINANCIAL_STATE_SETTLED = 3;
  BET_STATE_CHANGED_EVENT_FINANCIAL_STATE_REFUNDED = 4;
}

