supergraph:
  listen: 0.0.0.0:4000
  path: /internal/graphql
  introspection: false
homepage:
  enabled: false
sandbox:
  enabled: false
health_check:
  listen: 0.0.0.0:8088
  enabled: true
headers:
  all:
    request:
      - propagate:
          named: authorization
      - propagate:
          named: x-correlation-id
      - propagate:
          named: x-deadline-at
include_subgraph_errors:
  all: true
limits:
  http_max_request_bytes: 65536
traffic_shaping:
  router:
    timeout: 10s
  all:
    timeout: 5s
