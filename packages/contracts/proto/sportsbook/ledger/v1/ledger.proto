message SettleWinResponse {
  oneof outcome {
    LedgerSettleWinOutput value = 1;
    Error error = 2;
  }
}

message SettleLossResponse {
  oneof outcome {
    LedgerSettleLossOutput value = 1;
    Error error = 2;
  }
}

message CancelBetResponse {
  oneof outcome {
    LedgerCancelBetOutput value = 1;
