port: 4222
http_port: 8222
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 1GB
}
authorization {
  users: [
    {user: topology, password: $NATS_TOPOLOGY_PASSWORD},
    {user: events, password: $NATS_EVENTS_PASSWORD,
      permissions: {publish: ["sportsbook.events.v1.>"], subscribe: ["_INBOX.>"]}},
    {user: player, password: $NATS_PLAYER_PASSWORD,
      permissions: {publish: ["sportsbook.player.v1.>"], subscribe: ["_INBOX.>"]}},
    {user: ledger, password: $NATS_LEDGER_PASSWORD,
      permissions: {publish: ["sportsbook.ledger.v1.>"], subscribe: ["_INBOX.>"]}},
    {user: betting, password: $NATS_BETTING_PASSWORD,
      permissions: {
        publish: ["sportsbook.betting.v1.>", "$JS.API.CONSUMER.INFO.SPORTSBOOK_EVENTS.BETTING_RESULTS", "$JS.API.CONSUMER.MSG.NEXT.SPORTSBOOK_EVENTS.BETTING_RESULTS", "$JS.ACK.SPORTSBOOK_EVENTS.BETTING_RESULTS.>"],
        subscribe: ["_INBOX.>", "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.SPORTSBOOK_EVENTS.BETTING_RESULTS", "$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.SPORTSBOOK_EVENTS.BETTING_RESULTS"]
      }}
  ]
}
